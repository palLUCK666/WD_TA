<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background-color: aqua;
        }

        header {
            background-color: rgba(47, 11, 81, 0.872);
            color: white;
            padding: 10px;
            height: 30px;
        }

        .yellow-container {
            background-color: #FFA500;
            padding: 20px;
            overflow: auto;
        }

        .entries {
            float: left;
            width: 60%;
        }

        .entry-box {
            background-color: black;
            color: white;
            margin: 10px 0;
            height: 30px;
            padding: 5px;
            line-height: 20px;
        }

        .sidebar {
            float: right;
            /* right column */
            background-color: black;
            color: white;
            width: 300px;
            height: 200px;
            padding: 10px;
        }

        footer {
            background-color: blue;
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>
    Page
    <main>

        <header>Page Header</header>

        <section class="yellow-container">
            <div class="entries">
                <div class="entry-box">Entry-1</div>
                <div class="entry-box">Entry-2</div>
                <div class="entry-box">Entry-3</div>
            </div>

            <div class="sidebar">Sidebar</div>
        </section>

        <footer>
            &copy; &nbsp; Darshan University-Rajkot
        </footer>

    </main>

</body>

</html>
