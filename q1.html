<!DOCTYPE html>
<html>
<head>
    <title>Headings and Paragraph Demo</title>
</head>
<body>

<h1>Main Title of the Page</h1>
<p>This is the main introduction paragraph.</p>

<h2>Section 1</h2>
<p>This paragraph belongs to section 1.</p>

<h3>Subsection 1.1</h3>
<p>This is a paragraph under subsection.</p>

<h4>Topic A</h4>
<p>Details about topic A.</p>

<h5>Subtopic</h5>
<p>More details here.</p>

<h6>Note</h6>
<p>This is a small note paragraph.</p>

</body>
</html>
